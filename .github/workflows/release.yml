name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("project.toml").read_text(encoding="utf-8"))
          package = project["package"]
          if package["import"] != "dnn":
              raise SystemExit("project.toml package.import must be dnn")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"version={package['version']}", file=out)
          PY

      - name: Ensure release tag is new
        run: |
          tag="v${{ steps.package.outputs.version }}"
          ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1

      - name: Require same-version released dependencies
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          for repo in quidra math nn
          do
            if ! git ls-remote --exit-code --tags "https://github.com/quidra-lang/$repo.git" "refs/tags/v$version" >/dev/null 2>&1; then
              echo "DNN release is blocked until $repo v$version exists" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: v${{ steps.package.outputs.version }}
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: v${{ steps.package.outputs.version }}
          path: math
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/nn
          ref: v${{ steps.package.outputs.version }}
          path: nn
      - name: Expose released package dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/math" "$(dirname "$GITHUB_WORKSPACE")/math"
          ln -s "$GITHUB_WORKSPACE/nn" "$(dirname "$GITHUB_WORKSPACE")/nn"
      - name: Install Quidra dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache clang llvm libcurl4-openssl-dev
      - name: Build released Core
        run: cmake -S quidra -B quidra/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build quidra/build --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
      - name: Validate package metadata
        run: quidra/build/quidra package validate "$GITHUB_WORKSPACE"
      - name: Test DNN architectures
        run: |
          bash tests/integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
          bash tests/contracts.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Check example
        env:
          QUIDRA_PACKAGE_PATH: ${{ github.workspace }}/..
        run: quidra/build/quidra check examples/training.qui
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.package.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "dnn $tag"
          git push origin "$tag"
          gh release create "$tag" --target "$GITHUB_SHA" --title "dnn $tag" --generate-notes
