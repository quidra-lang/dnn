name: ci

on:
  push:
  pull_request:

jobs:
  architecture:
    name: Quidra develop architecture compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/nn
          ref: develop
          path: nn
      - name: Expose package dependencies as siblings
        run: |
          ln -s "${GITHUB_WORKSPACE}/math" "$(dirname "$GITHUB_WORKSPACE")/math"
          ln -s "${GITHUB_WORKSPACE}/nn" "$(dirname "$GITHUB_WORKSPACE")/nn"
      - name: Enforce synchronized first-party versions
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          versions = {
              "dnn": tomllib.loads(Path("project.toml").read_text())["package"]["version"],
              "quidra": tomllib.loads(Path("quidra/project.toml").read_text())["project"]["version"],
              "math": tomllib.loads(Path("math/project.toml").read_text())["package"]["version"],
              "nn": tomllib.loads(Path("nn/project.toml").read_text())["package"]["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"first-party versions must match: {versions}")
          PY
      - name: Install Quidra toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache clang llvm libcurl4-openssl-dev
      - name: Build Quidra develop
        run: cmake -S quidra -B quidra/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build quidra/build --parallel
      - name: Validate package metadata
        run: quidra/build/quidra package validate "$GITHUB_WORKSPACE"
      - name: Model integration
        run: bash tests/integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Architecture contracts
        run: bash tests/contracts.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
